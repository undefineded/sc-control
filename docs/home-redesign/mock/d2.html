<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>推荐方案 · 全部设备</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="devices.css">
</head>
<body>
<div class="screen">
  <div class="dp-top">
    <div class="dp-back"><svg class="ic sm" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></div>
    <div class="dp-head">
      <div class="dp-title">全部设备</div>
      <div class="dp-sub">4 台 · 3 个房间 · 2 台在线</div>
    </div>
    <div class="dp-add-btn"><svg class="ic sm" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg></div>
  </div>

  <div class="dp-chips">
    <span class="chip active">全部 <span class="chip-num" style="opacity:.5">4</span></span>
    <span class="chip">客厅 <span class="chip-num">1</span></span>
    <span class="chip">儿童房 <span class="chip-num">1</span></span>
    <span class="chip">待接入 <span class="chip-num">2</span></span>
  </div>

  <div class="dp-body">
    <div class="dp-room">
      <div class="dp-room-head">
        <span class="dp-room-name">客厅</span>
        <span class="dp-room-meta">1 台 · 24.2°C</span>
        <span class="dp-room-act"><i class="dot on"></i>在线</span>
      </div>
      <div class="dp-grid">
        <div class="tile on">
          <div class="tile-top">
            <div class="g blue">
              <svg class="ic" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="1.9"/>
                <ellipse cx="12" cy="6.4" rx="2.5" ry="4.9"/>
                <ellipse cx="12" cy="6.4" rx="2.5" ry="4.9" transform="rotate(120 12 12)"/>
                <ellipse cx="12" cy="6.4" rx="2.5" ry="4.9" transform="rotate(240 12 12)"/>
              </svg>
            </div>
            <i class="dot on"></i>
          </div>
          <div class="tile-id">
            <div class="tile-name">风扇</div>
            <div class="tile-state">运行中 · <strong>2 档</strong></div>
          </div>
          <div class="tile-foot">
            <span class="tile-meta">ESC · 25 分钟</span>
            <div class="switch on"></div>
          </div>
        </div>

        <div class="dp-add-tile">
          <span class="plus"><svg class="ic xs" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg></span>
          添加设备
        </div>
      </div>
    </div>

    <div class="dp-room">
      <div class="dp-room-head">
        <span class="dp-room-name">儿童房</span>
        <span class="dp-room-meta">1 台 · 23.6°C</span>
        <span class="dp-room-act"><i class="dot on"></i>播放中</span>
      </div>
      <div class="dp-grid">
        <div class="tile on">
          <div class="tile-top">
            <div class="g orange">
              <svg class="ic" viewBox="0 0 24 24">
                <path d="M12 6.4C10.5 5 8 4.5 5 4.5v14c3 0 5.5.5 7 2 1.5-1.5 4-2 7-2v-14c-3 0-5.5.5-7 2z"/>
                <path d="M12 6.4v14.1"/>
              </svg>
            </div>
            <i class="dot on"></i>
          </div>
          <div class="tile-id">
            <div class="tile-name">故事机</div>
            <div class="tile-state">播放中 · <strong>03:12</strong></div>
          </div>
          <div class="tile-foot">
            <span class="tile-meta">小熊的冬天</span>
            <button class="icon-btn" style="width:26px;height:26px">
              <svg class="ic xs" viewBox="0 0 24 24"><path d="M9.5 6.5v11M14.5 6.5v11"/></svg>
            </button>
          </div>
        </div>

        <div class="dp-add-tile">
          <span class="plus"><svg class="ic xs" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg></span>
          添加设备
        </div>
      </div>
    </div>

    <div class="dp-found">
      <div class="dp-found-head">
        <i class="dot warn"></i>待接入设备
        <span class="badge">发现 2 台</span>
      </div>
      <div class="dp-found-row">
        <div class="g blue" style="width:32px;height:32px;border-radius:10px">
          <svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px">
            <circle cx="12" cy="12" r="1.9"/>
            <ellipse cx="12" cy="6.4" rx="2.5" ry="4.9"/>
            <ellipse cx="12" cy="6.4" rx="2.5" ry="4.9" transform="rotate(120 12 12)"/>
            <ellipse cx="12" cy="6.4" rx="2.5" ry="4.9" transform="rotate(240 12 12)"/>
          </svg>
        </div>
        <div class="dp-found-id">
          <div class="dp-found-name">SC-FAN-02</div>
          <div class="dp-found-mac">蓝牙 · 未绑定</div>
        </div>
        <span class="dp-found-rssi">-58 dBm</span>
        <span class="pill soft" style="box-shadow:0 3px 10px rgba(59,142,255,.18)">接入</span>
      </div>
      <div class="dp-found-row">
        <div class="g orange" style="width:32px;height:32px;border-radius:10px">
          <svg class="ic" viewBox="0 0 24 24" style="width:16px;height:16px">
            <path d="M12 6.4C10.5 5 8 4.5 5 4.5v14c3 0 5.5.5 7 2 1.5-1.5 4-2 7-2v-14c-3 0-5.5.5-7 2z"/>
            <path d="M12 6.4v14.1"/>
          </svg>
        </div>
        <div class="dp-found-id">
          <div class="dp-found-name">STORY-03</div>
          <div class="dp-found-mac">蓝牙 · 未绑定</div>
        </div>
        <span class="dp-found-rssi">-71 dBm</span>
        <span class="pill soft">接入</span>
      </div>
    </div>

    <div class="dp-manage">
      <svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
      房间与分组管理
      <span>客厅 / 儿童房 / 书房 ›</span>
    </div>

    <div class="dp-eco">
      <div class="dp-eco-head">
        <span class="sec-title" style="font-size:12.5px">即将支持</span>
        <span style="font-size:9.5px;color:#a2adbd">万物互联路线图</span>
      </div>
      <div class="dp-eco-row">
        <div class="dp-eco-item"><svg class="ic" viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5.9 1.2.9 2h5.2c0-.8.3-1.5.9-2A6 6 0 0 0 12 3z"/></svg>智能灯</div>
        <div class="dp-eco-item"><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="4"/><circle cx="12" cy="9.5" r="2.4"/><path d="M8.5 16h7"/></svg>净化器</div>
        <div class="dp-eco-item"><svg class="ic" viewBox="0 0 24 24"><path d="M10 13.5V6a2 2 0 1 1 4 0v7.5a4 4 0 1 1-4 0z"/></svg>温湿度计</div>
        <div class="dp-eco-item"><svg class="ic" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5"/><path d="M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v4"/></svg>插座</div>
      </div>
      <div class="dp-wish">
        <svg class="ic xs" viewBox="0 0 24 24"><path d="M12 20.5s-7-4.4-7-9.2A4.3 4.3 0 0 1 12 8.6a4.3 4.3 0 0 1 7 2.7c0 4.8-7 9.2-7 9.2z"/></svg>
        没找到你的设备？告诉我们想接入什么
        <span>›</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
